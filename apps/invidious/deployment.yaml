apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious
  namespace: invidious
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invidious
  template:
    metadata:
      labels:
        app: invidious
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      enableServiceLinks: false
      containers:
        - name: invidious
          image: quay.io/invidious/invidious:latest-arm64
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /invidious/config/config.yml
              subPath: config.yml
          livenessProbe:
            httpGet:
              path: /api/v1/stats
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
      volumes:
        - name: config
          configMap:
            name: invidious-config
