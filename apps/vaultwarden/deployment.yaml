containers:
- name: vaultwarden
  image: vaultwarden/server:1.32.0
  ports:
  - containerPort: 80
  env:
  - name: DOMAIN
    value: "https://borgling-1.tail20def8.ts.net/vaultwarden"
  - name: ADMIN_TOKEN
    valueFrom:
      secretKeyRef:
        name: vaultwarden-admin-token
        key: token
  - name: SIGNUPS_ALLOWED
    value: "true"
  - name: ROCKET_PORT
    value: "80"
  livenessProbe:
    httpGet:
      path: /api/alive
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /api/alive
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
