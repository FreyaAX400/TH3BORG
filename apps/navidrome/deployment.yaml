apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      nodeSelector:
        kubernetes.io/hostname: borgling-1
      containers:
        - name: navidrome
          image: deluan/navidrome:latest
          ports:
            - containerPort: 4533
          env:
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_LOGLEVEL
              value: info
            - name: ND_SCANSCHEDULE
              value: "@every 1h"
            - name: ND_SESSIONTIMEOUT
              value: 24h
          volumeMounts:
            - name: music
              mountPath: /music
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: music
          hostPath:
            path: /home/music
            type: DirectoryOrCreate
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data-pvc
