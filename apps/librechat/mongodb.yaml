apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-mongodb
  namespace: librechat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat-mongodb
  template:
    metadata:
      labels:
        app: librechat-mongodb
    spec:
      nodeSelector:
        kubernetes.io/hostname: borgling-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mongodb
          image: mongo:4.4.18
          command: ["mongod", "--bind_ip_all", "--dbpath", "/data/db"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - mongo
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: librechat-mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-mongodb
  namespace: librechat
spec:
  selector:
    app: librechat-mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
