apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: librechat
data:
  librechat.yaml: |
    version: 1.2.1
    cache: true
    endpoints:
      custom:
        - name: "Ollama"
          apiKey: "ollama"
          baseURL: "http://100.106.53.62:11434/v1/"
          models:
            default: ["qwen3:8b"]
            fetch: true
          titleConvo: true
          titleModel: "current_model"
          summarize: false
          modelDisplayLabel: "BORG"
