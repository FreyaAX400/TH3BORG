apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-meilisearch
  namespace: librechat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat-meilisearch
  template:
    metadata:
      labels:
        app: librechat-meilisearch
    spec:
      nodeSelector:
        kubernetes.io/hostname: borgling-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.7
          ports:
            - containerPort: 7700
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: meili-master-key
            - name: MEILI_ENV
              value: production
            - name: MEILI_NO_ANALYTICS
              value: "true"
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: meilisearch-data
          persistentVolumeClaim:
            claimName: librechat-meilisearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-meilisearch
  namespace: librechat
spec:
  selector:
    app: librechat-meilisearch
  ports:
    - port: 7700
      targetPort: 7700
  type: ClusterIP
