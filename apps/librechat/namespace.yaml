apiVersion: v1
kind: Namespace
metadata:
  name: librechat
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librechat-mongodb-data
  namespace: librechat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librechat-meilisearch-data
  namespace: librechat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librechat-images
  namespace: librechat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
