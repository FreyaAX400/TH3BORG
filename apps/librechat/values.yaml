global:
  security:
    allowInsecureImages: true

# LibreChat Helm values for TH3BORG
# Chart: oci://ghcr.io/danny-avila/librechat-chart/librechat

librechat:
  configEnv:
    APP_TITLE: "BORG"
    ALLOW_REGISTRATION: "false"
    ALLOW_EMAIL_LOGIN: "true"
    ALLOW_SOCIAL_LOGIN: "false"
    ALLOW_SOCIAL_REGISTRATION: "false"
    OLLAMA_BASE_URL: "http://100.106.53.62:11434"
    OPENAI_API_KEY: "user_provided"
    ANTHROPIC_API_KEY: ""
    GOOGLE_KEY: ""
    MEILI_HOST: "http://librechat-meilisearch:7700"
    RAG_API_URL: "http://librechat-rag-api:8000"
    SESSION_EXPIRY: "1000 * 60 * 60 * 24 * 7"
    REFRESH_TOKEN_EXPIRY: "1000 * 60 * 60 * 24 * 30"
  config: |
    version: 1.2.1
    cache: true
    endpoints:
      ollama:
        baseURL: "http://100.106.53.62:11434/v1"
        models:
          default: ["qwen3:8b"]
          fetch: true
        titleConvo: true
        titleModel: "qwen3:8b"
        summarize: false
        forcePrompt: false
        modelDisplayLabel: "BORG"
    mcpServers:
      time:
        type: stdio
        command: uvx
        args:
          - mcp-server-time
          - "--local-timezone=America/Los_Angeles"
      fetch:
        type: stdio
        command: uvx
        args:
          - mcp-server-fetch
credentialsSecretName: "librechat-credentials-env"
mongodb:
  enabled: true
  image:
    registry: docker.io
    repository: mongodb/mongodb-community-server
    tag: "7.0-ubi8"
  auth:
    enabled: true
    existingSecret: "librechat-mongodb-secret"
  persistence:
    enabled: true
    size: 10Gi
meilisearch:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
rag:
  enabled: true
  image:
    repository: ghcr.io/danny-avila/librechat-rag-api-dev-lite
    tag: latest
  env:
    EMBEDDINGS_PROVIDER: "ollama"
    OLLAMA_BASE_URL: "http://100.106.53.62:11434"
    EMBEDDINGS_MODEL: "nomic-embed-text"
deployment:
  nodeSelector:
    kubernetes.io/hostname: borgling-1
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
ingress:
  enabled: true
  className: nginx
  annotations:
    th3borg.org/apps-portal: "true"
    th3borg.org/apps-name: "BORG"
    th3borg.org/apps-description: "BORG AI — Qwen3 8B"
    th3borg.org/apps-icon: ""
    nginx.org/proxy-read-timeout: "600"
    nginx.org/proxy-send-timeout: "600"
    nginx.org/proxy-buffering: "false"
    nginx.org/websocket-services: "librechat"
  hosts:
    - host: borg.th3borg.org
      paths:
        - path: /
          pathType: Prefix
