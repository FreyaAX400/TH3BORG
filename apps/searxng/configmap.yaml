apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true
    server:
      secret_key: "iDtYUfgVDhznsxG1u0U26DOTljznsOn6TNVNMv8hbuY"
      limiter: false
      image_proxy: true
      base_url: "https://search.th3borg.org"
    ui:
      default_theme: simple
      default_locale: en
    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      formats:
        - html
        - json
    engines:
      - name: google
        engine: google
        shortcut: g
      - name: duckduckgo
        engine: duckduckgo
        shortcut: d
      - name: bing
        engine: bing
        shortcut: b
      - name: wikipedia
        engine: wikipedia
        shortcut: w
      - name: github
        engine: github
        shortcut: gh
