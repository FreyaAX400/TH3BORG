apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-postgres
  namespace: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia-postgres
  template:
    metadata:
      labels:
        app: authelia-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: borgling-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: authelia
            - name: POSTGRES_USER
              value: authelia
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authelia-postgres-data
