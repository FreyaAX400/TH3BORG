apiVersion: v1
data:
  index.html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta
    name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>TH3BORG</title>\n<style>\n
    \ @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');\n
    \ :root { --green: #00ff41; --green-dim: #00a827; --green-dark: #003b0e; --red:
    #ff0040; --yellow: #ffe000; --bg: #000500; --scanline: rgba(0,255,65,0.03); }\n
    \ * { margin: 0; padding: 0; box-sizing: border-box; }\n  body { background: var(--bg);
    color: var(--green); font-family: \"Share Tech Mono\", monospace; min-height:
    100vh; overflow-x: hidden; cursor: crosshair; }\n  body::before { content: \"\";
    position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent,
    transparent 2px, var(--scanline) 2px, var(--scanline) 4px); pointer-events: none;
    z-index: 1000; }\n  body::after { content: \"\"; position: fixed; inset: 0; background:
    radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%); pointer-events:
    none; z-index: 999; animation: flicker 8s infinite; }\n  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; } 96% { opacity: 0.92; } 97% { opacity: 1; } 98% {
    opacity: 0.95; } }\n  .container { max-width: 1200px; margin: 0 auto; padding:
    2rem; }\n  .ascii-header { font-family: \"VT323\", monospace; font-size: clamp(0.7rem,
    2vw, 1.2rem); line-height: 1.15; color: var(--green); text-shadow: 0 0 10px var(--green),
    0 0 20px var(--green-dim); white-space: pre; overflow: hidden; animation: glow-pulse
    3s ease-in-out infinite; margin-bottom: 0.5rem; }\n  @keyframes glow-pulse { 0%,
    100% { text-shadow: 0 0 10px var(--green), 0 0 20px var(--green-dim); } 50% {
    text-shadow: 0 0 20px var(--green), 0 0 40px var(--green-dim), 0 0 60px var(--green-dark);
    } }\n  .tagline { font-family: \"VT323\", monospace; font-size: 1.4rem; color:
    var(--green-dim); margin-bottom: 2rem; letter-spacing: 0.3em; }\n  .tagline::before
    { content: \"[ \"; } .tagline::after { content: \" ]\"; }\n  .status-bar { display:
    flex; gap: 2rem; padding: 0.5rem 1rem; border: 1px solid var(--green-dark); border-left:
    3px solid var(--green); background: rgba(0,255,65,0.03); margin-bottom: 2rem;
    font-size: 0.85rem; flex-wrap: wrap; }\n  .status-item { display: flex; gap: 0.5rem;
    align-items: center; }\n  .status-label { color: var(--green-dim); } .status-value
    { color: var(--green); }\n  .blink { animation: blink 1s step-end infinite; }\n
    \ @keyframes blink { 50% { opacity: 0; } }\n  .grid { display: grid; grid-template-columns:
    1fr 1fr; gap: 1.5rem; }\n  .panel { border: 1px solid var(--green-dark); background:
    rgba(0,255,65,0.02); padding: 1.2rem; position: relative; transition: border-color
    0.3s, background 0.3s; }\n  .panel:hover { border-color: var(--green-dim); background:
    rgba(0,255,65,0.05); }\n  .panel::before { content: \"\"; position: absolute;
    top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent,
    var(--green), transparent); }\n  .panel-title { font-family: \"VT323\", monospace;
    font-size: 1.3rem; color: var(--green-dim); letter-spacing: 0.2em; margin-bottom:
    1rem; }\n  .panel-title::before { content: \"> \"; color: var(--green); }\n  .services
    { grid-column: 1 / 2; grid-row: 1 / 3; }\n  .service-list { display: flex; flex-direction:
    column; gap: 0.6rem; }\n  .service-item { display: flex; align-items: center;
    gap: 0.8rem; padding: 0.5rem 0.7rem; border: 1px solid transparent; text-decoration:
    none; color: var(--green); transition: all 0.2s; position: relative; }\n  .service-item:hover
    { border-color: var(--green-dark); background: rgba(0,255,65,0.05); padding-left:
    1.2rem; }\n  .service-item:hover::before { content: \">> \"; position: absolute;
    left: 0.3rem; color: var(--green); }\n  .service-dot { width: 8px; height: 8px;
    border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; background:
    var(--green-dim); }\n  .service-dot.up { background: var(--green); box-shadow:
    0 0 8px var(--green); }\n  .service-dot.down { background: var(--red); box-shadow:
    0 0 8px var(--red); animation: blink 0.5s step-end infinite; }\n  .service-dot.unknown
    { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }\n  .service-name
    { flex: 1; font-size: 1rem; } .service-url { font-size: 0.75rem; color: var(--green-dim);
    } .service-ping { font-size: 0.75rem; color: var(--green-dim); margin-left: auto;
    }\n  .stats { grid-column: 2 / 3; grid-row: 1 / 2; }\n  .stat-row { margin-bottom:
    1rem; }\n  .stat-label { display: flex; justify-content: space-between; font-size:
    0.85rem; margin-bottom: 0.3rem; color: var(--green-dim); }\n  .stat-label span:last-child
    { color: var(--green); }\n  .stat-bar { height: 8px; background: var(--green-dark);
    position: relative; overflow: hidden; }\n  .stat-fill { height: 100%; background:
    var(--green); box-shadow: 0 0 6px var(--green); transition: width 1s ease; position:
    relative; }\n  .stat-fill::after { content: \"\"; position: absolute; right: 0;
    top: 0; bottom: 0; width: 2px; background: #fff; opacity: 0.8; }\n  .stat-fill.warning
    { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }\n  .stat-fill.critical
    { background: var(--red); box-shadow: 0 0 6px var(--red); }\n  .node-info { margin-top:
    1rem; padding-top: 1rem; border-top: 1px solid var(--green-dark); font-size: 0.8rem;
    color: var(--green-dim); display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
    }\n  .node-info span { color: var(--green); }\n  .errors { grid-column: 2 / 3;
    grid-row: 2 / 3; }\n  .error-list { display: flex; flex-direction: column; gap:
    0.5rem; max-height: 300px; overflow-y: auto; }\n  .error-list::-webkit-scrollbar
    { width: 4px; } .error-list::-webkit-scrollbar-track { background: var(--green-dark);
    } .error-list::-webkit-scrollbar-thumb { background: var(--green-dim); }\n  .error-item
    { padding: 0.5rem 0.7rem; border-left: 2px solid var(--red); background: rgba(255,0,64,0.05);
    font-size: 0.8rem; }\n  .error-item.warning { border-left-color: var(--yellow);
    background: rgba(255,224,0,0.05); }\n  .error-title { color: var(--green); margin-bottom:
    0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .error-meta
    { color: var(--green-dim); font-size: 0.72rem; }\n  .no-errors { color: var(--green-dim);
    font-size: 0.85rem; padding: 1rem 0; text-align: center; }\n  .no-errors::before
    { content: \"✓ \"; color: var(--green); }\n  .footer { margin-top: 2rem; padding-top:
    1rem; border-top: 1px solid var(--green-dark); display: flex; justify-content:
    space-between; font-size: 0.75rem; color: var(--green-dim); }\n  .loading { color:
    var(--green-dim); font-size: 0.85rem; }\n  @media (max-width: 768px) { .grid {
    grid-template-columns: 1fr; } .services, .stats, .errors { grid-column: 1; grid-row:
    auto; } .ascii-header { font-size: 0.5rem; } }\n</style>\n</head>\n<body>\n<div
    class=\"container\">\n  <div class=\"ascii-header\"> _____ _   _  ___________
    \ ___________ _____ \n|_   _| | | ||____ | ___ \\|  _  | ___ \\  __ \\\n  | |
    | |_| |    / / |_/ /| | | | |_/ / |  \\/\n  | | |  _  |    \\ \\ ___ \\| | | |
    \   /| | __ \n  | | | | | |.___/ / |_/ /\\ \\_/ / |\\ \\| |_\\ \\\n  \\_/ \\_|
    |_/\\____/\\____/  \\___/\\_| \\_|\\____/</div>\n  <div class=\"tagline\">HOMELAB
    COMMAND CENTER :: ONLINE</div>\n  <div class=\"status-bar\">\n    <div class=\"status-item\"><span
    class=\"status-label\">SYS:</span><span class=\"status-value\" id=\"sys-time\">--:--:--</span></div>\n
    \   <div class=\"status-item\"><span class=\"status-label\">NODE:</span><span
    class=\"status-value\">BORGling-1</span></div>\n    <div class=\"status-item\"><span
    class=\"status-label\">CLUSTER:</span><span class=\"status-value\" id=\"cluster-status\">CHECKING<span
    class=\"blink\">_</span></span></div>\n    <div class=\"status-item\"><span class=\"status-label\">UPTIME:</span><span
    class=\"status-value\" id=\"page-uptime\">0s</span></div>\n  </div>\n  <div class=\"grid\">\n
    \   <div class=\"panel services\"><div class=\"panel-title\">SERVICES</div><div
    class=\"service-list\" id=\"service-list\"><div class=\"loading\">SCANNING SERVICES...</div></div></div>\n
    \   <div class=\"panel stats\"><div class=\"panel-title\">CLUSTER RESOURCES</div><div
    id=\"stats-content\"><div class=\"loading\">QUERYING PROMETHEUS...</div></div></div>\n
    \   <div class=\"panel errors\"><div class=\"panel-title\">RECENT ERRORS</div><div
    class=\"error-list\" id=\"error-list\"><div class=\"loading\">FETCHING GLITCHTIP...</div></div></div>\n
    \ </div>\n  <div class=\"footer\"><span>TH3BORG HOMELAB // th3borg.org</span><span
    id=\"last-refresh\">LAST REFRESH: --</span></div>\n</div>\n<script>\nconst SERVICES
    = [\n  { name: \"VAULTWARDEN\", url: \"https://vaultwarden.th3borg.org\" },\n
    \ { name: \"BOOKSTACK\",   url: \"https://bookstack.th3borg.org\" },\n  { name:
    \"GRAFANA\",     url: \"https://grafana.th3borg.org\" },\n  { name: \"GLITCHTIP\",
    \  url: \"https://glitchtip.th3borg.org\" },\n  { name: \"ARGOCD\",      url:
    \"https://argocd.th3borg.org\" },\n  { name: \"UPTIME KUMA\", url: \"https://uptime.th3borg.org\"
    },\n  { name: \"LIVESYNC\",    url: \"https://livesync.th3borg.org\" },\n];\nfunction
    updateClock() { document.getElementById(\"sys-time\").textContent = new Date().toLocaleTimeString(\"en-GB\",{hour12:false});
    }\nsetInterval(updateClock,1000); updateClock();\nconst startTime = Date.now();\nsetInterval(()=>{
    const s=Math.floor((Date.now()-startTime)/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
    document.getElementById(\"page-uptime\").textContent=h>0?h+\"h \"+m+\"m \"+sec+\"s\":m>0?m+\"m
    \"+sec+\"s\":sec+\"s\"; },1000);\nfunction renderServices(results) {\n  document.getElementById(\"service-list\").innerHTML=results.map(s=>`<a
    class=\"service-item\" href=\"${s.url}\" target=\"_blank\" rel=\"noopener\"><div
    class=\"service-dot ${s.status}\"></div><span class=\"service-name\">${s.name}</span><span
    class=\"service-url\">${s.url.replace(\"https://\",\"\")}</span>${s.ping?`<span
    class=\"service-ping\">${s.ping}ms</span>`:\"\"}</a>`).join(\"\");\n  const allUp=results.every(s=>s.status===\"up\"),anyDown=results.some(s=>s.status===\"down\");\n
    \ document.getElementById(\"cluster-status\").innerHTML=allUp?\"ALL SYSTEMS NOMINAL\":anyDown?'<span
    style=\"color:var(--red)\">DEGRADED</span>':\"PARTIAL\";\n}\nasync function checkServices()
    {\n  const results=await Promise.all(SERVICES.map(async s=>{ const t=Date.now();
    try{ await fetch(s.url,{method:\"HEAD\",mode:\"no-cors\",signal:AbortSignal.timeout(5000)});
    return{...s,status:\"up\",ping:Date.now()-t}; }catch{ return{...s,status:\"down\",ping:null};
    } }));\n  renderServices(results);\n}\nasync function fetchStats() {\n  const
    el=document.getElementById(\"stats-content\");\n  try {\n    const b=\"https://prometheus.th3borg.org/api/v1/\";\n
    \   const [cpu,memT,memA,pods]=await Promise.all([\n      fetch(b+'query?query=100-(avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))*100)').then(r=>r.json()).catch(()=>null),\n
    \     fetch(b+\"query?query=node_memory_MemTotal_bytes\").then(r=>r.json()).catch(()=>null),\n
    \     fetch(b+\"query?query=node_memory_MemAvailable_bytes\").then(r=>r.json()).catch(()=>null),\n
    \     fetch(b+'query?query=count(kube_pod_info{namespace!=\"kube-system\"})').then(r=>r.json()).catch(()=>null),\n
    \   ]);\n    const cpuP=cpu?parseFloat(cpu.data.result[0]?.value[1]||0).toFixed(1):null;\n
    \   const mTG=memT?(parseFloat(memT.data.result[0]?.value[1])/1073741824).toFixed(1):null;\n
    \   const mAG=memA?(parseFloat(memA.data.result[0]?.value[1])/1073741824).toFixed(1):null;\n
    \   const mP=mTG&&mAG?(((mTG-mAG)/mTG)*100).toFixed(1):null;\n    const pc=pods?pods.data.result[0]?.value[1]:null;\n
    \   el.innerHTML=`<div class=\"stat-row\"><div class=\"stat-label\"><span>CPU
    USAGE</span><span>${cpuP??\"??\"}%</span></div><div class=\"stat-bar\"><div class=\"stat-fill
    ${cpuP>80?\"critical\":cpuP>60?\"warning\":\"\"}\" style=\"width:${cpuP??0}%\"></div></div></div><div
    class=\"stat-row\"><div class=\"stat-label\"><span>MEMORY</span><span>${mP??\"??\"}%
    (${mAG??\"??\"}GB free)</span></div><div class=\"stat-bar\"><div class=\"stat-fill
    ${mP>85?\"critical\":mP>70?\"warning\":\"\"}\" style=\"width:${mP??0}%\"></div></div></div><div
    class=\"node-info\"><div>TOTAL RAM: <span>${mTG??\"??\"}GB</span></div><div>PODS:
    <span>${pc??\"??\"}</span></div><div>ARCH: <span>ARM64</span></div><div>K3S: <span>ACTIVE</span></div></div>`;\n
    \ } catch(e){ el.innerHTML=`<div class=\"loading\">PROMETHEUS UNREACHABLE</div>`;
    }\n}\nasync function fetchErrors() {\n  const el=document.getElementById(\"error-list\");\n
    \ try {\n    const r=await fetch(\"https://glitchtip.th3borg.org/api/0/issues/?limit=8\",{headers:{\"Authorization\":\"Bearer
    GLITCHTIP_API_TOKEN\"}});\n    if(!r.ok) throw new Error(\"auth\");\n    const
    issues=await r.json();\n    if(!issues.length){ el.innerHTML=`<div class=\"no-errors\">NO
    RECENT ERRORS DETECTED</div>`; return; }\n    el.innerHTML=issues.map(i=>`<div
    class=\"error-item ${i.level===\"warning\"?\"warning\":\"\"}\"><div class=\"error-title\">${i.title||i.culprit}</div><div
    class=\"error-meta\">${i.project?.name??\"unknown\"} // ${i.count} occurrences
    // ${new Date(i.lastSeen).toLocaleString()}</div></div>`).join(\"\");\n  } catch(e){
    el.innerHTML=`<div class=\"no-errors\">CONFIGURE API TOKEN TO VIEW ERRORS</div>`;
    }\n}\nfunction refresh(){ checkServices(); fetchStats(); fetchErrors(); document.getElementById(\"last-refresh\").textContent=\"LAST
    REFRESH: \"+new Date().toLocaleTimeString(\"en-GB\",{hour12:false}); }\nrefresh();
    setInterval(refresh,30000);\n</script>\n</body>\n</html>"
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: homepage-html
  namespace: homepage
