0 6px currentColor; background: var(--green-dim); }\n  .service-dot.up { background: var(--green); box-shadow: 0 0 8px var(--green); }\n  .service-dot.down { background: var(--red); box-shadow: 0 0 8px var(--red); animation: blink 0.5s step-end infinite; }\n  .service-dot.unknown { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }\n  .service-name { flex: 1; font-size: 1rem; } .service-url { font-size: 0.75rem; color: var(--green-dim); } .service-ping { font-size: 0.75rem; color: var(--green-dim); margin-left: auto; }\n  .stats { grid-column: 2 / 3; grid-row: 1 / 2; }\n  .stat-row { margin-bottom: 1rem; }\n  .stat-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--green-dim); }\n  .stat-label span:last-child { color: var(--green); }\n  .stat-bar { height: 8px; background: var(--green-dark); position: relative; overflow: hidden; }\n  .stat-fill { height: 100%; background: var(--green); box-shadow: 0 0 6px var(--green); transition: width 1s ease; position: relative; }\n  .stat-fill::after { content: \"\"; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: #fff; opacity: 0.8; }\n  .stat-fill.warning { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }\n  .stat-fill.critical { background: var(--red); box-shadow: 0 0 6px var(--red); }\n  .node-info { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--green-dark); font-size: 0.8rem; color: var(--green-dim); display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }\n  .node-info span { color: var(--green); }\n  .errors { grid-column: 2 / 3; grid-row: 2 / 3; }\n  .error-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 300px; overflow-y: auto; }\n  .error-list::-webkit-scrollbar { width: 4px; } .error-list::-webkit-scrollbar-track { background: var(--green-dark); } .error-list::-webkit-scrollbar-thumb { background: var(--green-dim); }\n  .error-item { padding: 0.5rem 0.7rem; border-left: 2px solid var(--red); background: rgba(255,0,64,0.05); font-size: 0.8rem; }\n  .error-item.warning { border-left-color: var(--yellow); background: rgba(255,224,0,0.05); }\n  .error-title { color: var(--green); margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .error-meta { color: var(--green-dim); font-size: 0.72rem; }\n  .no-errors { color: var(--green-dim); font-size: 0.85rem; padding: 1rem 0; text-align: center; }\n  .no-errors::before { content: \"✓ \"; color: var(--green); }\n  .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--green-dark); display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--green-dim); }\n  .loading { color: var(--green-dim); font-size: 0.85rem; }\n  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .services, .stats, .errors { grid-column: 1; grid-row: auto; } .ascii-header { font-size: 0.5rem; } }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"container\"\u003e\n  \u003cdiv class=\"ascii-header\"\u003e _____ _   _  ___________  ___________ _____ \n|_   _| | | ||____ | ___ \\|  _  | ___ \\  __ \\\n  | | | |_| |    / / |_/ /| | | | |_/ / |  \\/\n  | | |  _  |    \\ \\ ___ \\| | | |    /| | __ \n  | | | | | |.___/ / |_/ /\\ \\_/ / |\\ \\| |_\\ \\\n  \\_/ \\_| |_/\\____/\\____/  \\___/\\_| \\_|\\____/\u003c/div\u003e\n  \u003cdiv class=\"tagline\"\u003eHOMELAB COMMAND CENTER :: ONLINE\u003c/div\u003e\n  \u003cdiv class=\"status-bar\"\u003e\n    \u003cdiv class=\"status-item\"\u003e\u003cspan class=\"status-label\"\u003eSYS:\u003c/span\u003e\u003cspan class=\"status-value\" id=\"sys-time\"\u003e--:--:--\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"status-item\"\u003e\u003cspan class=\"status-label\"\u003eNODE:\u003c/span\u003e\u003cspan class=\"status-value\"\u003eBORGling-1\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"status-item\"\u003e\u003cspan class=\"status-label\"\u003eCLUSTER:\u003c/span\u003e\u003cspan class=\"status-value\" id=\"cluster-status\"\u003eCHECKING\u003cspan class=\"blink\"\u003e_\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"status-item\"\u003e\u003cspan class=\"status-label\"\u003eUPTIME:\u003c/span\u003e\u003cspan class=\"status-value\" id=\"page-uptime\"\u003e0s\u003c/span\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"grid\"\u003e\n    \u003cdiv class=\"panel services\"\u003e\u003cdiv class=\"panel-title\"\u003eSERVICES\u003c/div\u003e\u003cdiv class=\"service-list\" id=\"service-list\"\u003e\u003cdiv class=\"loading\"\u003eSCANNING SERVICES...\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv class=\"panel stats\"\u003e\u003cdiv class=\"panel-title\"\u003eCLUSTER RESOURCES\u003c/div\u003e\u003cdiv id=\"stats-content\"\u003e\u003cdiv class=\"loading\"\u003eQUERYING PROMETHEUS...\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv class=\"panel errors\"\u003e\u003cdiv class=\"panel-title\"\u003eRECENT ERRORS\u003c/div\u003e\u003cdiv class=\"error-list\" id=\"error-list\"\u003e\u003cdiv class=\"loading\"\u003eFETCHING GLITCHTIP...\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"footer\"\u003e\u003cspan\u003eTH3BORG HOMELAB // th3borg.org\u003c/span\u003e\u003cspan id=\"last-refresh\"\u003eLAST REFRESH: --\u003c/span\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cscript\u003e\nfunction updateClock() { document.getElementById(\"sys-time\").textContent = new Date().toLocaleTimeString(\"en-GB\",{hour12:false}); }\nsetInterval(updateClock,1000); updateClock();\nfunction fmtUptime(s){ const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60; return d\u003e0?d+\"d \"+h+\"h \"+m+\"m\":h\u003e0?h+\"h \"+m+\"m \"+sec+\"s\":m\u003e0?m+\"m \"+sec+\"s\":sec+\"s\"; }\n\nasync function refresh() {\n  try {\n    const data = await fetch(\"/api/status\").then(r=\u003er.json());\n\n    document.getElementById(\"service-list\").innerHTML = data.services.map(s=\u003e`\u003ca class=\"service-item\" href=\"${s.url}\" target=\"_blank\" rel=\"noopener\"\u003e\u003cdiv class=\"service-dot ${s.status}\"\u003e\u003c/div\u003e\u003cspan class=\"service-name\"\u003e${s.name}\u003c/span\u003e\u003cspan class=\"service-url\"\u003e${s.url.replace(\"https://\",\"\")}\u003c/span\u003e${s.ping?`\u003cspan class=\"service-ping\"\u003e${s.ping}ms\u003c/span\u003e`:\"\"}\u003c/a\u003e`).join(\"\");\n    const allUp=data.services.every(s=\u003es.status===\"up\"), anyDown=data.services.some(s=\u003es.status===\"down\");\n    document.getElementById(\"cluster-status\").innerHTML=allUp?\"ALL SYSTEMS NOMINAL\":anyDown?'\u003cspan style=\"color:var(--red)\"\u003eDEGRADED\u003c/span\u003e':\"PARTIAL\";\n\n    const c = data.cluster;\n    const cpuCls = c.cpu_pct\u003e80?\"critical\":c.cpu_pct\u003e60?\"warning\":\"\";\n    const memCls = c.mem_used_pct\u003e85?\"critical\":c.mem_used_pct\u003e70?\"warning\":\"\";\n    document.getElementById(\"stats-content\").innerHTML=`\u003cdiv class=\"stat-row\"\u003e\u003cdiv class=\"stat-label\"\u003e\u003cspan\u003eCPU USAGE\u003c/span\u003e\u003cspan\u003e${c.cpu_pct??\"??\"}%\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"stat-bar\"\u003e\u003cdiv class=\"stat-fill ${cpuCls}\" style=\"width:${c.cpu_pct??0}%\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"stat-row\"\u003e\u003cdiv class=\"stat-label\"\u003e\u003cspan\u003eMEMORY\u003c/span\u003e\u003cspan\u003e${c.mem_used_pct??\"??\"}% (${c.mem_avail_gb??\"??\"}GB free)\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"stat-bar\"\u003e\u003cdiv class=\"stat-fill ${memCls}\" style=\"width:${c.mem_used_pct??0}%\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"node-info\"\u003e\u003cdiv\u003eTOTAL RAM: \u003cspan\u003e${c.mem_total_gb??\"??\"}GB\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003ePODS: \u003cspan\u003e${c.pods??\"??\"}\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003eARCH: \u003cspan\u003eARM64\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003eK3S: \u003cspan\u003eACTIVE\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e`;\n\n    const el = document.getElementById(\"error-list\");\n    if(!data.errors||!data.errors.length){ el.innerHTML='\u003cdiv class=\"no-errors\"\u003eNO RECENT ERRORS DETECTED\u003c/div\u003e'; }\n    else { el.innerHTML=data.errors.map(i=\u003e`\u003cdiv class=\"error-item ${i.level===\"warning\"?\"warning\":\"\"}\"\u003e\u003cdiv class=\"error-title\"\u003e${i.title}\u003c/div\u003e\u003cdiv class=\"error-meta\"\u003e${i.project} // ${i.count} occurrences // ${new Date(i.lastSeen).toLocaleString()}\u003c/div\u003e\u003c/div\u003e`).join(\"\"); }\n\n    if(data.cluster.uptime_seconds) document.getElementById(\"page-uptime\").textContent=fmtUptime(data.cluster.uptime_seconds);\n    document.getElementById(\"last-refresh\").textContent=\"LAST REFRESH: \"+new Date().toLocaleTimeString(\"en-GB\",{hour12:false});\n  } catch(e) {\n    console.error(\"Status fetch failed:\", e);\n  }\n}\nrefresh(); setInterval(refresh,30000);\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e","robots.txt":"User-agent: *\nDisallow: /\n\nUser-agent: GPTBot\nDisallow: /\n\nUser-agent: ChatGPT-User\nDisallow: /\n\nUser-agent: Google-Extended\nDisallow: /\n\nUser-agent: anthropic-ai\nDisallow: /\n\nUser-agent: Claude-Web\nDisallow: /\n\nUser-agent: cohere-ai\nDisallow: /\n\nUser-agent: PerplexityBot\nDisallow: /\n\nUser-agent: Amazonbot\nDisallow: /\n\nUser-agent: Meta-ExternalAgent\nDisallow: /\n\nUser-agent: Bytespider\nDisallow: /\n"},"kind":"ConfigMap","metadata":{"annotations":{},"creationTimestamp":null,"name":"homepage-html","namespace":"homepage"}}
