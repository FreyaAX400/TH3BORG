apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      nodeSelector:
        kubernetes.io/hostname: borgling-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: homepage
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
        - name: sidecar
          image: localhost:32000/th3borg/homepage-sidecar:latest
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring:9090"
            - name: GLITCHTIP_URL
              value: "http://glitchtip-web.glitchtip:8000"
            - name: GLITCHTIP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: GLITCHTIP_TOKEN
      volumes:
        - name: html
          configMap:
            name: homepage-html
