<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TH3BORG // HOMELAB</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo-block">
      <div class="logo">TH3<span>BORG</span></div>
      <div class="logo-sub">HOMELAB OPERATIONS CENTER</div>
    </div>
    <div class="status-strip">
      <div class="status-row">
        <div class="status-item"><span class="status-label">SYS</span><span class="status-value" id="sys-time">--:--:--</span></div>
        <div class="status-item"><span class="status-label">NODE</span><span class="status-value">BORGLING-1</span></div>
      </div>
      <div id="cluster-badge" class="cluster-badge nominal"><div class="badge-dot"></div>CHECKING</div>
    </div>
  </header>
  <div class="grid">
    <div class="panel panel-services">
      <div class="panel-inner">
        <div class="panel-header"><div class="panel-icon">◈</div><span class="panel-title">SERVICES</span><span class="panel-count" id="service-count">—</span></div>
        <div class="service-list" id="service-list"><div class="loading">SCANNING SERVICES...</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-inner">
        <div class="panel-header"><div class="panel-icon">◆</div><span class="panel-title">CLUSTER RESOURCES</span></div>
        <div id="stats-content"><div class="loading">QUERYING PROMETHEUS...</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-inner">
        <div class="panel-header"><div class="panel-icon">⬡</div><span class="panel-title">NODE STATUS</span></div>
        <div id="nodes-content"><div class="loading">QUERYING NODES...</div></div>
      </div>
    </div>
    <div class="panel" style="grid-column: 2 / 4;">
      <div class="panel-inner">
        <div class="panel-header"><div class="panel-icon">△</div><span class="panel-title">RECENT ERRORS</span></div>
        <div class="error-list" id="error-list"><div class="loading">FETCHING GLITCHTIP...</div></div>
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-left"><span>TH3BORG HOMELAB</span><a href="https://th3borg.org" class="accent" style="text-decoration:none;">th3borg.org</a></div>
    <span id="last-refresh">—</span>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
