apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-valkey
  namespace: glitchtip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip-valkey
  template:
    metadata:
      labels:
        app: glitchtip-valkey
    spec:
      nodeSelector:
        kubernetes.io/hostname: borgling-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: valkey
          image: valkey/valkey:8
---
apiVersion: v1
kind: Service
metadata:
  name: glitchtip-valkey
  namespace: glitchtip
spec:
  selector:
    app: glitchtip-valkey
  ports:
    - port: 6379
