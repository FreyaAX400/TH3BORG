apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livesync
  namespace: livesync
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "app://obsidian.md,capacitor://localhost,http://localhost"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, HEAD, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "accept, authorization, content-type, origin, referer"
spec:
  ingressClassName: nginx
  rules:
  - host: borgling-1.tail20def8.ts.net
    http:
      paths:
      - path: /livesync(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: livesync
            port:
              number: 5984
