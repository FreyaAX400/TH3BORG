apiVersion: apps/v1
kind: Deployment
metadata:
  name: livesync
  namespace: livesync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livesync
  template:
    metadata:
      labels:
        app: livesync
    spec:
      containers:
      - name: livesync
        image: couchdb:3.3
        env:
        - name: COUCHDB_USER
          value: "admin"
        - name: COUCHDB_PASSWORD
          value: "changeme"
        - name: ERL_FLAGS
          value: "-setcookie monster"
        ports:
        - containerPort: 5984
        livenessProbe:
          httpGet:
            path: /
            port: 5984
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
        volumeMounts:
        - name: data
          mountPath: /opt/couchdb/data
        - name: config
          mountPath: /opt/couchdb/etc/local.d
      initContainers:
      - name: init-couchdb
        image: busybox
        command:
        - sh
        - -c
        - |
          cat > /config/local.ini << 'INI'
          [chttpd]
          bind_address = 0.0.0.0
          port = 5984

          [httpd]
          enable_cors = true

          [cors]
          origins = app://obsidian.md,capacitor://localhost,http://localhost
          credentials = true
          headers = accept, authorization, content-type, origin, referer
          methods = GET, PUT, POST, HEAD, DELETE
          max_age = 3600
          INI
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: livesync-data
      - name: config
        emptyDir: {}
