apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: ollama-webui
  annotations:
    th3borg.org/apps-portal: "true"
    th3borg.org/apps-name: "AI"
    th3borg.org/apps-description: "Local AI — Qwen3 8B via Ollama"
    th3borg.org/apps-icon: ""
    nginx.org/proxy-read-timeout: "600"
    nginx.org/proxy-send-timeout: "600"
    nginx.org/client-max-body-size: "50m"
    nginx.org/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: ai.th3borg.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
