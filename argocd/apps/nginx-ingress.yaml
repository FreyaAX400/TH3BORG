apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.nginx.com/stable
    chart: nginx-ingress
    targetRevision: "2.5.0"
    helm:
      releaseName: nginx-ingress
      values: |
        controller:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          enableSnippets: true
          ingressClass:
            name: nginx
            create: true
            setAsDefaultIngress: false
          service:
            type: LoadBalancer
            httpPort:
              enable: true
              port: 8080
            httpsPort:
              enable: true
              port: 8443
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
