apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glitchtip
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/api/v4/projects/16325141/packages/helm/stable
    chart: glitchtip
    targetRevision: "7.0.0"
    helm:
      releaseName: glitchtip
      values: |
        secret:
          SECRET_KEY: "OXNZNpBqO+YS8pHzYy6CPaA3stI8apR2UqsvxYzHiMLm4XxPD349bDNY2gmWJ8o2
1Co="
        web:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        worker:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        postgresql:
          primary:
            nodeSelector:
              kubernetes.io/hostname: borgling-1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            persistence:
              size: 10Gi
              storageClass: local-path
        valkey:
          primary:
            nodeSelector:
              kubernetes.io/hostname: borgling-1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: glitchtip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
