apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://guerzon.github.io/vaultwarden
    chart: vaultwarden
    targetRevision: "0.34.4"
    helm:
      valueFiles:
        - $values/values/vaultwarden.yaml
 sources:
    - repoURL: https://guerzon.github.io/vaultwarden
      chart: vaultwarden
      targetRevision: "0.34.4"
      helm:
        valueFiles:
          - $values/values/vaultwarden.yaml
    - repoURL: https://github.com/JohanLarsson-Hall/TH3BORG.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/JohanLarsson-Hall/TH3BORG.git
      targetRevision: HEAD
      path: argocd/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
