apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://sentry-kubernetes.github.io/charts
    chart: sentry
    targetRevision: "29.3.0"
    helm:
      releaseName: sentry
      values: |
        user:
          email: esme-parastrata.rebuff148@slmails.com
          password: "changeme"
        system:
          secretKey: "changeme-replace-with-random-string"
        nginx:
          enabled: false
        ingress:
          enabled: false
          ingressClassName: nginx
          hostname: borgling-1.tail20def8.ts.net
          path: /sentry
        filestore:
          backend: filesystem
          filesystem:
            path: /data/sentry-files
            persistence:
              enabled: false
              size: 20Gi
              storageClass: local-path
        postgresql:
          enabled: false
          primary:
            nodeSelector:
              kubernetes.io/hostname: borgling-1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            persistence:
              size: 20Gi
              storageClass: local-path
        redis:
          enabled: false
          master:
            nodeSelector:
              kubernetes.io/hostname: borgling-1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
          replica:
            nodeSelector:
              kubernetes.io/hostname: borgling-1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        kafka:
          enabled: false
          controller:
            replicaCount: 1
            nodeSelector:
              kubernetes.io/hostname: borgling-1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        clickhouse:
          enabled: false
          clickhouse:
            replicas: 1
            nodeSelector:
              kubernetes.io/hostname: borgling-1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        hooks:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        web:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        worker:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        cron:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        snuba:
          api:
            nodeSelector:
              kubernetes.io/hostname: borgling-1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
        relay:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        taskbroker:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        taskworker:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        externalRedis:
          host: "sentry-sentry-redis-master"
          port: 6379
        taskscheduler:
          nodeSelector:
            kubernetes.io/hostname: borgling-1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: sentry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
