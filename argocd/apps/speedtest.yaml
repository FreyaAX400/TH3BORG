apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: speedtest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FreyaAX400/TH3BORG.git
    targetRevision: HEAD
    path: apps/speedtest
  destination:
    server: https://kubernetes.default.svc
    namespace: speedtest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
